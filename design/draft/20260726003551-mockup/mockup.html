<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Prompt Editor - Pro Console</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#93000a",
                    "on-surface-variant": "#c7c4d7",
                    "secondary-fixed-dim": "#4cd7f6",
                    "inverse-surface": "#dae2fd",
                    "surface-container-lowest": "#060e20",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#2d3449",
                    "secondary-container": "#03b5d3",
                    "surface-container-highest": "#2d3449",
                    "on-secondary-fixed-variant": "#004e5c",
                    "on-tertiary": "#2d3133",
                    "on-surface": "#dae2fd",
                    "secondary": "#4cd7f6",
                    "surface": "#0b1326",
                    "on-secondary-fixed": "#001f26",
                    "on-primary-container": "#0d0096",
                    "surface-bright": "#31394d",
                    "surface-container": "#171f33",
                    "tertiary": "#c4c7c9",
                    "primary-fixed-dim": "#c0c1ff",
                    "inverse-on-surface": "#283044",
                    "surface-container-high": "#222a3d",
                    "on-secondary": "#003640",
                    "tertiary-fixed": "#e0e3e5",
                    "on-secondary-container": "#00424e",
                    "on-tertiary-fixed-variant": "#444749",
                    "on-error": "#690005",
                    "background": "#0b1326",
                    "on-background": "#dae2fd",
                    "surface-dim": "#0b1326",
                    "tertiary-fixed-dim": "#c4c7c9",
                    "on-tertiary-container": "#272a2c",
                    "error": "#ffb4ab",
                    "on-primary-fixed": "#07006c",
                    "surface-tint": "#c0c1ff",
                    "inverse-primary": "#494bd6",
                    "primary": "#c0c1ff",
                    "outline": "#908fa0",
                    "secondary-fixed": "#acedff",
                    "surface-container-low": "#131b2e",
                    "primary-container": "#8083ff",
                    "primary-fixed": "#e1e0ff",
                    "outline-variant": "#464554",
                    "tertiary-container": "#8e9193",
                    "on-primary": "#1000a9",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "on-tertiary-fixed": "#191c1e"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "container-margin": "16px",
                    "xl": "32px",
                    "base": "4px",
                    "gutter": "12px",
                    "xs": "8px",
                    "lg": "24px",
                    "md": "16px",
                    "sm": "12px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "code-mono": ["JetBrains Mono"],
                    "headline-lg": ["Inter"],
                    "label-caps": ["Inter"],
                    "body-sm": ["Inter"],
                    "headline-xl": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "code-mono": ["13px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0b1326;
            color: #dae2fd;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #171f33;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #464554;
            border-radius: 2px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #c0c1ff;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease-in-out;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar (from JSON) -->
<header class="bg-surface dark:bg-surface text-primary dark:text-primary w-full border-b border-outline-variant flat no shadows fixed top-0 z-50">
<div class="flex items-center justify-between px-md py-xs w-full max-w-7xl mx-auto h-14">
<button class="material-symbols-outlined hover:bg-surface-container-high transition-colors p-2 rounded-full active:opacity-80 transition-opacity">arrow_back</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-semibold text-on-surface dark:text-on-surface">AI Prompt Editor</h1>
<button class="px-md py-1 bg-primary text-on-primary rounded font-label-caps text-label-caps active:opacity-80 transition-opacity">Save</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-14 pb-20 px-container-margin mt-base">
<!-- Hero Identity Area (Atmospheric) -->
<div class="relative w-full h-24 rounded-xl overflow-hidden my-lg flex items-center justify-center border border-outline-variant">

<div class="relative z-10 text-center">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-widest block mb-1">Advanced Mode</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">System-level instruction tuning</p>
</div>
</div>
<div class="space-y-lg">
<!-- System Prompt Area -->
<section class="flex flex-col gap-sm">
<div class="flex items-center justify-between">
<h2 class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">terminal</span>
                        SYSTEM PROMPT
                    </h2>
<span class="text-[10px] font-code-mono text-outline uppercase">Read-only for users</span>
</div>
<div class="relative rounded-xl bg-surface-container border border-outline-variant focus-within:border-primary transition-colors overflow-hidden">
<textarea class="w-full h-64 p-md bg-transparent border-none focus:ring-0 font-code-mono text-code-mono text-on-surface resize-none custom-scrollbar" id="prompt-editor" placeholder="Define the behavior of the AI agent... Use {{variable}} syntax for dynamic inputs.">You are a helpful assistant specialized in technical documentation. 
Always respond in a concise, professional tone. 

CONTEXT:
User Name: {{user_name}}
Interaction History: {{history}}

OBJECTIVE:
Synthesize technical data provided into readable summaries.</textarea>
<!-- Line Numbers / Visual Flourish -->
<div class="absolute bottom-2 right-2 flex items-center gap-sm">
<span class="text-[10px] font-code-mono text-outline">Ln 12, Col 42</span>
<div class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></div>
</div>
</div>
</section>
<!-- Dynamic Variables Bento -->
<section class="space-y-sm">
<h2 class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">token</span>
                    INJECTABLE VARIABLES
                </h2>
<div class="grid grid-cols-2 gap-sm">
<button class="p-sm flex flex-col items-start gap-1 bg-surface-container-low border border-outline-variant rounded-lg hover:bg-surface-container-high active:scale-95 transition-all" onclick="insertVar('{{user_name}}')">
<span class="font-code-mono text-xs text-primary">{{user_name}}</span>
<span class="text-[10px] text-outline">User Profile Name</span>
</button>
<button class="p-sm flex flex-col items-start gap-1 bg-surface-container-low border border-outline-variant rounded-lg hover:bg-surface-container-high active:scale-95 transition-all" onclick="insertVar('{{history}}')">
<span class="font-code-mono text-xs text-primary">{{history}}</span>
<span class="text-[10px] text-outline">Last 5 interactions</span>
</button>
<button class="p-sm flex flex-col items-start gap-1 bg-surface-container-low border border-outline-variant rounded-lg hover:bg-surface-container-high active:scale-95 transition-all" onclick="insertVar('{{current_date}}')">
<span class="font-code-mono text-xs text-primary">{{current_date}}</span>
<span class="text-[10px] text-outline">ISO Timestamp</span>
</button>
<button class="p-sm flex flex-col items-start gap-1 bg-surface-container-low border border-outline-variant rounded-lg hover:bg-surface-container-high active:scale-95 transition-all" onclick="insertVar('{{metadata}}')">
<span class="font-code-mono text-xs text-primary">{{metadata}}</span>
<span class="text-[10px] text-outline">Session context</span>
</button>
</div>
</section>
<!-- Configuration Parameters -->
<section class="bg-surface-container-high border border-outline-variant rounded-xl p-md space-y-lg">
<h2 class="font-label-caps text-label-caps text-on-surface flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">settings_input_component</span>
                    MODEL PARAMETERS
                </h2>
<!-- Temperature Slider -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-body-sm text-body-sm text-on-surface-variant">Temperature</label>
<span class="font-code-mono text-secondary" id="temp-val">0.7</span>
</div>
<input max="2" min="0" oninput="document.getElementById('temp-val').innerText = this.value" step="0.1" type="range" value="0.7"/>
<div class="flex justify-between text-[10px] text-outline uppercase">
<span>Precise</span>
<span>Creative</span>
</div>
</div>
<div class="h-px bg-outline-variant"></div>
<!-- Max Tokens Input -->
<div class="flex items-center justify-between">
<div class="space-y-1">
<label class="font-body-sm text-body-sm text-on-surface-variant block">Max Tokens</label>
<p class="text-[10px] text-outline">Limit output length</p>
</div>
<div class="flex items-center bg-surface-container-lowest border border-outline-variant rounded px-sm py-1">
<input class="bg-transparent border-none text-right font-code-mono text-secondary w-16 focus:ring-0 p-0" type="number" value="2048"/>
<span class="text-[10px] text-outline ml-xs">TK</span>
</div>
</div>
<div class="h-px bg-outline-variant"></div>
<!-- Top P Toggle -->
<div class="flex items-center justify-between">
<div class="space-y-1">
<label class="font-body-sm text-body-sm text-on-surface-variant block">Nucleus Sampling</label>
<p class="text-[10px] text-outline">Top P filtering</p>
</div>
<div class="relative inline-flex items-center cursor-pointer" onclick="toggleSwitch(this)">
<div class="w-10 h-5 bg-primary-container rounded-full transition-colors" id="switch-bg"></div>
<div class="absolute left-1 top-1 bg-on-primary w-3 h-3 rounded-full transition-transform translate-x-5" id="switch-thumb"></div>
</div>
</div>
</section>
<!-- Bottom CTA Section (Optional Mobile Specific) -->
<div class="grid grid-cols-2 gap-md pt-md">
<button class="flex items-center justify-center gap-xs py-sm border border-outline-variant rounded-lg font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-sm">history</span>
                    HISTORY
                </button>
<button class="flex items-center justify-center gap-xs py-sm border border-outline-variant rounded-lg font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-sm">science</span>
                    TEST
                </button>
</div>
</div>
</main>
<!-- BottomNavBar (from JSON) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-lg py-sm bg-surface-container dark:bg-surface-container border-t border-outline-variant h-16">
<div class="flex flex-col items-center justify-center text-secondary dark:text-secondary font-bold scale-95 duration-100">
<span class="material-symbols-outlined">edit_note</span>
<span class="font-label-caps text-label-caps">Editor</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-secondary-fixed-dim cursor-pointer transition-colors">
<span class="material-symbols-outlined">biotech</span>
<span class="font-label-caps text-label-caps">Test Sandbox</span>
</div>
</nav>
<script>
        function insertVar(variable) {
            const editor = document.getElementById('prompt-editor');
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            editor.value = text.substring(0, start) + variable + text.substring(end);
            editor.focus();
            editor.setSelectionRange(start + variable.length, start + variable.length);
        }

        function toggleSwitch(el) {
            const bg = el.querySelector('#switch-bg');
            const thumb = el.querySelector('#switch-thumb');
            const isActive = thumb.classList.contains('translate-x-5');
            
            if (isActive) {
                thumb.classList.remove('translate-x-5');
                bg.classList.remove('bg-primary-container');
                bg.classList.add('bg-surface-variant');
            } else {
                thumb.classList.add('translate-x-5');
                bg.classList.remove('bg-surface-variant');
                bg.classList.add('bg-primary-container');
            }
        }

        // Simple haptic-like effect for inputs
        document.querySelectorAll('input, button').forEach(item => {
            item.addEventListener('touchstart', () => {
                if ('vibrate' in navigator) navigator.vibrate(5);
            });
        });
    </script>
</body></html>
